<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Issue - SmartCampus360</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            min-height: 100vh;

            background-image:
                linear-gradient(
                    rgba(20, 40, 100, 0.60),
                    rgba(25, 35, 80, 0.68)
                ),
                url("images/college.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .navbar {
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #183b82;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #183b82;
            font-weight: bold;
            padding: 9px 14px;
            border-radius: 8px;
        }

        .nav-links a:hover {
            background: #183b82;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 50px auto;
        }

        .form-card {
            background: rgba(255, 255, 255, 0.96);
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
        }

        .form-card h1 {
            text-align: center;
            color: #183b82;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .form-card p {
            text-align: center;
            color: #555;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            font-family: Arial, sans-serif;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #183b82;
            box-shadow: 0 0 5px rgba(24, 59, 130, 0.25);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #183b82;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #102b63;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #183b82;
            font-weight: bold;
        }

        .back-home:hover {
            text-decoration: underline;
        }

        @media (max-width: 700px) {
            .navbar {
                padding: 15px 20px;
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
            }

            .container {
                width: 94%;
                margin: 30px auto;
            }

            .form-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">🏫 SmartCampus 360</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="track.html">Track Request</a>
        </div>
    </nav>

    <div class="container">

        <div class="form-card">

            <h1>📝 Report an Issue</h1>

            <p>
                Submit your campus issue and our staff will take care of it.
            </p>

            <form action="submit_request.php" method="POST">

                <div class="form-group">
                    <label for="studentName">Student Name</label>

                    <input
                        type="text"
                        id="studentName"
                        name="studentName"
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="studentEmail">Student Email</label>

                    <input
                        type="email"
                        id="studentEmail"
                        name="studentEmail"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="category">Issue Category</label>

                    <select id="category" name="category" required>
                        <option value="">-- Select Issue Category --</option>
                        <option value="Electrical">Electrical</option>
                        <option value="Plumbing">Plumbing</option>
                        <option value="Wi-Fi">Wi-Fi</option>
                        <option value="Cleaning">Cleaning</option>
                        <option value="Furniture">Furniture</option>
                        <option value="AC / Fan">AC / Fan</option>
                        <option value="Laboratory">Laboratory</option>
                        <option value="Projector">Projector</option>
                        <option value="Classroom">Classroom</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="location">Location</label>

                    <input
                        type="text"
                        id="location"
                        name="location"
                        placeholder="Example: Block A, Room 204"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="description">Issue Description</label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="Describe your issue clearly..."
                        required
                    ></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    🚀 Submit Request
                </button>

            </form>

            <a href="index.html" class="back-home">
                ← Back to Home
            </a>

        </div>

    </div>

</body>
</html>
