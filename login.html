<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - SmartCampus360</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            background-image:
                linear-gradient(
                    rgba(20, 40, 100, 0.60),
                    rgba(25, 35, 80, 0.68)
                ),
                url("images/college.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);

            text-align: center;
        }

        .logo {
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            color: #333;
            margin-bottom: 8px;
            font-size: 30px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
            font-size: 15px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 13px;

            border: 2px solid #ddd;
            border-radius: 10px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #667eea;
        }

        /* Password wrapper */

        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding-right: 50px;
        }

        /* Eye button */

        .eye-button {
            position: absolute;

            right: 8px;
            top: 50%;

            transform: translateY(-50%);

            width: 38px;
            height: 38px;

            border: none;
            background: transparent;

            cursor: pointer;

            font-size: 19px;

            display: flex;
            justify-content: center;
            align-items: center;

            z-index: 5;
        }

        .eye-button:hover {
            background: #eeeeee;
            border-radius: 50%;
        }

        .login-btn {
            width: 100%;

            padding: 14px;

            margin-top: 8px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(135deg, #667eea, #764ba2);

            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .register-link {
            margin-top: 22px;

            color: #666;

            font-size: 14px;
        }

        .register-link a {
            color: #667eea;

            text-decoration: none;

            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .home-link {
            display: inline-block;

            margin-top: 18px;

            color: #764ba2;

            text-decoration: none;

            font-size: 14px;

            font-weight: bold;
        }

        .home-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {

            .login-container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">🏫</div>

    <h1>SmartCampus360</h1>

    <p class="subtitle">
        Login to your campus account
    </p>


    <!-- LOGIN FORM -->

    <form action="login.php" method="POST">

        <!-- EMAIL -->

        <div class="form-group">

            <label for="email">
                📧 Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your registered email"
                required
            >

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label for="password">
                🔑 Password
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <button
                    type="button"
                    class="eye-button"
                    onclick="showHidePassword('password', this)"
                    title="Show Password"
                >
                    👁️
                </button>

            </div>

        </div>


        <!-- LOGIN BUTTON -->

        <button
            type="submit"
            class="login-btn"
        >
            🔐 Login
        </button>

    </form>


    <!-- REGISTER LINK -->

    <div class="register-link">

        Don't have an account?

        <a href="register.html">
            Create Account
        </a>

    </div>


    <!-- HOME -->

    <a
        href="index.html"
        class="home-link"
    >
        🏠 Back to Home
    </a>

</div>


<!-- PASSWORD SHOW/HIDE -->

<script>

function showHidePassword(inputId, button) {

    const passwordInput =
        document.getElementById(inputId);

    if (passwordInput.type === "password") {

        passwordInput.type = "text";

        button.innerHTML = "🙈";

        button.title = "Hide Password";

    } else {

        passwordInput.type = "password";

        button.innerHTML = "👁️";

        button.title = "Show Password";

    }

}

</script>

</body>
</html>
