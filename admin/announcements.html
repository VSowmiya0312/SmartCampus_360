<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>
Campus Announcements - SmartCampus360
</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #667eea,
            #764ba2
        );

    padding: 30px 15px;
}

.container {

    max-width: 900px;

    margin: auto;
}

.header {

    background: white;

    padding: 30px;

    border-radius: 20px;

    margin-bottom: 25px;

    text-align: center;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,0.15);
}

.header-icon {

    font-size: 50px;
}

.header h1 {

    margin: 10px 0;

    color: #333;
}

.header p {

    color: #777;
}

.announcement {

    background: white;

    padding: 25px;

    border-radius: 18px;

    margin-bottom: 18px;

    box-shadow:
        0 10px 25px
        rgba(0,0,0,0.12);
}

.announcement h2 {

    color: #667eea;

    margin-top: 0;
}

.message {

    color: #555;

    line-height: 1.7;

    white-space: pre-wrap;
}

.date {

    margin-top: 15px;

    color: #888;

    font-size: 13px;
}

.loading,
.empty {

    background: white;

    padding: 40px;

    border-radius: 18px;

    text-align: center;

    color: #777;
}

.back {

    display: inline-block;

    margin-top: 10px;

    padding: 12px 20px;

    background: #333;

    color: white;

    text-decoration: none;

    border-radius: 8px;
}

</style>

</head>

<body>

<div class="container">


    <div class="header">

        <div class="header-icon">
            📢
        </div>

        <h1>
            Campus Announcements
        </h1>

        <p>
            Stay updated with the latest
            SmartCampus360 campus information.
        </p>

    </div>


    <div id="announcementContainer">

        <div class="loading">
            Loading announcements...
        </div>

    </div>


    <a
        href="index.html"
        class="back"
    >
        ← Back to Home
    </a>


</div>


<script>

fetch("admin/announcements_list.php")

.then(function(response) {

    if (!response.ok) {

        throw new Error(
            "Unable to load announcements."
        );

    }

    return response.json();

})

.then(function(data) {

    const container =
        document.getElementById(
            "announcementContainer"
        );

    container.innerHTML = "";


    if (data.length === 0) {

        container.innerHTML = `

            <div class="empty">

                <div style="font-size:45px;">
                    📢
                </div>

                <h2>
                    No Announcements
                </h2>

                <p>
                    There are currently
                    no campus announcements.
                </p>

            </div>

        `;

        return;
    }


    data.forEach(function(item) {

        const card =
            document.createElement("div");

        card.className =
            "announcement";


        const title =
            document.createElement("h2");

        title.textContent =
            "📢 " + item.title;


        const message =
            document.createElement("div");

        message.className =
            "message";

        message.textContent =
            item.message;


        const date =
            document.createElement("div");

        date.className =
            "date";

        date.textContent =
            "Published: " +
            item.created_at;


        card.appendChild(title);

        card.appendChild(message);

        card.appendChild(date);

        container.appendChild(card);

    });

})

.catch(function(error) {

    console.error(error);

    document.getElementById(
        "announcementContainer"
    ).innerHTML = `

        <div class="empty">

            ❌ Unable to load announcements.

        </div>

    `;

});

</script>

</body>

</html>
