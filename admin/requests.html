<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Requests - SmartCampus360</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8f9ff);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            color: white;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .navbar nav {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
        }

        .navbar nav a {
            color: white;
            text-decoration: none;
            font-weight: 500;
        }

        .page-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .page-container h1 {
            text-align: center;
            color: #312e81;
            margin-bottom: 30px;
        }

        .request-card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            border-left: 6px solid #6366f1;
        }

        .request-card h2 {
            margin-top: 0;
            color: #4338ca;
        }

        .request-card p {
            margin: 10px 0;
            color: #374151;
        }

        .status {
            display: inline-block;
            padding: 7px 14px;
            border-radius: 20px;
            background: #e0e7ff;
            color: #3730a3;
            font-weight: bold;
        }

        .staff {
            font-weight: bold;
            color: #059669;
        }

        .action-buttons {
            margin-top: 20px;
        }

        .assign-btn {
            display: inline-block;
            padding: 12px 20px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .assign-btn:hover {
            opacity: 0.9;
        }

        .empty {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 11px 18px;
            background: #374151;
            color: white;
            text-decoration: none;
            border-radius: 9px;
        }
    </style>
</head>

<body>

<header class="navbar">

    <div class="logo">🏫 SmartCampus360</div>

    <nav>
        <a href="../index.html">🏠 Home</a>
        <a href="../report.html">📝 Report Issue</a>
        <a href="../track.html">🔍 Track Request</a>
        <a href="../announcements.html">📢 Announcements</a>
        <a href="../contact.html">📞 Contact</a>
        <a href="dashboard.html">📊 Dashboard</a>
    </nav>

</header>

<main class="page-container">

    <h1>📋 Manage Student Requests</h1>

    <div id="requests">

        <div class="empty">
            <h2>⏳ Loading Requests...</h2>
        </div>

    </div>

</main>

<script>

async function loadRequests() {

    const container = document.getElementById("requests");

    try {

        const response = await fetch("requests.php");

        if (!response.ok) {
            throw new Error("Unable to load requests");
        }

        const requests = await response.json();

        if (requests.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    <h2>📭 No Requests Available</h2>
                    <p>No student requests have been submitted yet.</p>
                    <a href="dashboard.html" class="back-btn">
                        ← Back to Dashboard
                    </a>
                </div>
            `;

            return;
        }

        container.innerHTML = "";

        requests.forEach(request => {

            container.innerHTML += `

                <div class="request-card">

                    <h2>🎫 ${request.track_id}</h2>

                    <p>
                        <strong>👨‍🎓 Student:</strong>
                        ${request.student_name}
                    </p>

                    <p>
                        <strong>📧 Email:</strong>
                        ${request.student_email}
                    </p>

                    <p>
                        <strong>🛠 Category:</strong>
                        ${request.category}
                    </p>

                    <p>
                        <strong>📍 Location:</strong>
                        ${request.location}
                    </p>

                    <p>
                        <strong>📝 Description:</strong>
                        ${request.description}
                    </p>

                    <p>
                        <strong>📊 Status:</strong>
                        <span class="status">
                            ${request.status}
                        </span>
                    </p>

                    <p>
                        <strong>👨‍🔧 Assigned Staff:</strong>
                        <span class="staff">
                            ${request.assigned_staff}
                        </span>
                    </p>

                    <div class="action-buttons">

                        <a
                            href="assign_staff.php?track=${encodeURIComponent(request.track_id)}"
                            class="assign-btn">

                            👨‍🔧 Assign Staff

                        </a>

                    </div>

                </div>

            `;

        });

    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="empty">

                <h2>❌ Unable to Load Requests</h2>

                <p>
                    Please make sure XAMPP Apache and MySQL are running.
                </p>

                <a href="dashboard.html" class="back-btn">
                    ← Back to Dashboard
                </a>

            </div>
        `;

    }

}

loadRequests();

</script>

</body>
</html>
